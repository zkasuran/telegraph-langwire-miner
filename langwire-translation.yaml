version: "1"
kind: miner
id: 7337
slug: langwire-translation
protocol: generic
name: LangWire Translation
description: >
  Translate a phrase or a sentence into a target language, read live at request time from the
  public keyless MyMemory API. Answers the LANGUAGE_TRANSLATION intent for the common world
  languages by name or by ISO code. The source language is auto-detected when it is not given.
  The translated text is the answer, stated verbatim in the sentence and repeated in the
  readings with the languages and the match quality. No API key.
base_url: https://telegraph-lang.margyn.workers.dev

docs:
  documentation: https://telegraph-lang.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is the phrase or sentence to translate. target is a language name (Spanish) or an ISO code (es). A whole question such as Translate "good morning" into Spanish is accepted too.
    param: text
    property: length
    value_num: 500
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example Translate "good morning"
        into Spanish. The miner parses the text and the target language out of it, so passing
        the whole question works as well as the structured fields.
    text:
      type: string
      description: The phrase or sentence to translate.
    to:
      type: string
      description: Target language, a name such as Spanish or an ISO code such as es.
    from:
      type: string
      description: Optional source language, a name or an ISO code. Auto-detected when omitted.

output_schema:
  type: object
  properties:
    source_text:
      type: string
      description: The text that was translated.
    source_lang:
      type: string
      description: Source language ISO code, detected or given.
    target_lang:
      type: string
      description: Target language ISO code.
    target_language:
      type: string
      description: Target language name.
    translation:
      type: string
      description: The translated text, verbatim from MyMemory.
    match_percent:
      type: integer
      description: MyMemory match quality for the translation, 0 to 100.
    confidence:
      type: number
      description: 0.95 to 0.97 for a direct translation.
    summary:
      type: string
      description: One sentence stating the translation verbatim, then a Readings block.
    source:
      type: string
      description: The public source that produced the translation.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /translate
    external_path: /translate
    method: GET
    description: >
      Translate one text, the text and the target as query parameters
      (?text=hello&to=es). Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - LANGUAGE_TRANSLATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: source_text
        description: The text that was translated.
        source_path: source_text
      - index: 1
        name: target_lang
        description: Target language ISO code.
        source_path: target_lang
      - index: 2
        name: translation
        description: The translated text, verbatim from MyMemory.
        source_path: translation
      - index: 3
        name: summary
        description: One sentence stating the translation verbatim, then a Readings block.
        source_path: summary
    integers:
      - index: 0
        name: match_percent
        description: MyMemory match quality for the translation, 0 to 100.
        source_path: match_percent
        multiplier: 1
  request:
    - endpoint: translate
      method: GET
      query_params:
        text: { source: strings.0 }
        to: { source: strings.1 }
