version: "1"
kind: miner
id: 7337
slug: langwire-translation
protocol: generic
name: LangWire Translation
description: >
  Translate a phrase or a sentence into a target language, answered by a language model at
  request time. Send the text with the target language or send the whole question. The miner
  returns the idiomatic translation stated in one plain sentence. The source language is
  inferred from the text. The answer is produced with MiniMax (MiniMax-M3) under a commercial
  plan held by the operator, so this miner is not keyless. Serves the LANGUAGE_TRANSLATION
  intent.
base_url: https://telegraph-lang.margyn.workers.dev

docs:
  documentation: https://telegraph-lang.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: text is the phrase or sentence to translate. to is a language name (Spanish) or an ISO code (es). A whole question such as Translate "good morning" into Spanish is accepted too.
    param: text
    property: length
    value_num: 2000
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example Translate "good morning"
        into Spanish. The miner reads the text and the target language from it, so passing the
        whole question works as well as the structured fields.
    text:
      type: string
      description: The phrase or sentence to translate.
    to:
      type: string
      description: Target language, a name such as Spanish or an ISO code such as es.

output_schema:
  type: object
  properties:
    source_text:
      type: string
      description: The text that was translated.
    target_language:
      type: string
      description: Target language as given in the request.
    translation:
      type: string
      description: The translated text, read from the stated answer.
    summary:
      type: string
      description: One sentence stating the translation idiomatically.
    confidence:
      type: number
      description: 0.96 for a direct translation, lower when the answer is degraded.
    as_of:
      type: string
      description: ISO 8601 timestamp the answer was produced.

endpoints:
  - path: /translate
    external_path: /translate
    method: GET
    description: >
      Translate one text, the text and the target as query parameters
      (?text=hello&to=es). Also accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - LANGUAGE_TRANSLATION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: source_text
        description: The text that was translated.
        source_path: source_text
      - index: 1
        name: translation
        description: The translated text, read from the stated answer.
        source_path: translation
      - index: 2
        name: summary
        description: One sentence stating the translation idiomatically.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Confidence in the answer, scaled by one hundred to keep two digits as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: translate
      method: GET
      query_params:
        text: { source: strings.0 }
        to: { source: strings.1 }
